name: Build LiveContainer IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ForceDuoApp/**'
      - 'scripts/build-livecontainer.sh'
      - '.github/workflows/build-livecontainer.yml'
  pull_request:
    paths:
      - 'ForceDuoApp/**'
      - 'scripts/build-livecontainer.sh'
      - '.github/workflows/build-livecontainer.yml'

permissions:
  contents: read

concurrency:
  group: livecontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          if [[ "${sdk_version%%.*}" -lt 27 ]]; then
            echo '::error::ForceDuo requires an iOS 27 SDK or newer.'
            exit 1
          fi

      - name: Build and package
        run: bash scripts/build-livecontainer.sh

      - name: Verify IPA archive
        run: unzip -t dist/ForceDuo-LiveContainer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ForceDuo-LiveContainer-${{ github.run_number }}
          path: dist/ForceDuo-LiveContainer.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish IPA release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download built IPA
        uses: actions/download-artifact@v8
        with:
          name: ForceDuo-LiveContainer-${{ github.run_number }}
          path: dist

      - name: Create release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_number }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${RELEASE_RUN}-${RELEASE_ATTEMPT}"
          gh release create "$tag" dist/ForceDuo-LiveContainer.ipa \
            --target "$RELEASE_COMMIT" \
            --title "ForceDuo LiveContainer build ${RELEASE_RUN}.${RELEASE_ATTEMPT}" \
            --generate-notes \
            --latest
